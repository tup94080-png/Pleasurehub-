<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #1a73e8;
    }

    header p {
      font-size: 1rem;
      color: #666;
      margin-top: 5px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .card .info {
      padding: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      margin-top: 50px;
    }

    #error {
      text-align: center;
      color: #d93025;
      font-size: 1rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Photo Gallery</h1>
    <p>Media loaded directly from Google Drive</p>
  </header>

  <div id="loading">Loading photos...</div>
  <div id="error"></div>
  <div class="gallery" id="gallery"></div>

  <script>
    // Configuration
    const FOLDER_ID = '1IlBDjudHYmo6y-JmYj7-IY9hhADEDxUC';
    // Replace YOUR_GOOGLE_DRIVE_API_KEY with your actual API key from Google Cloud Console
    const API_KEY = 'AIzaSyDM0_CoUN-DVcE4XWzDn2auPtPt1CQP2L0';

    async function loadGallery() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const galleryEl = document.getElementById('gallery');

      if (API_KEY === 'YOUR_GOOGLE_DRIVE_API_KEY') {
        loadingEl.style.display = 'none';
        errorEl.textContent = 'Please insert your Google Drive API key into the script to display the photos.';
        return;
      }

      const query = `'${FOLDER_ID}' in parents and trashed = false and mimeType contains 'image/'`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,webContentLink,thumbnailLink)&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        loadingEl.style.display = 'none';

        if (!data.files || data.files.length === 0) {
          errorEl.textContent = 'No images found in this folder.';
          return;
        }

        data.files.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          // Thumbnail / Direct View URL construction
          const imgUrl = `https://lh3.googleusercontent.com/d/${file.id}`;

          card.innerHTML = `
            <a href="${imgUrl}" target="_blank" rel="noopener noreferrer">
              <img src="${imgUrl}" alt="${file.name}" loading="lazy" />
            </a>
            <div class="info" title="${file.name}">${file.name}</div>
          `;

          galleryEl.appendChild(card);
        });
      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.textContent = `Error loading photos: ${err.message}`;
      }
    }

    loadGallery();
  </script>

</body>
  </html>
