<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Google Drive Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #1a73e8;
    }

    header p {
      font-size: 1rem;
      color: #666;
      margin-top: 5px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
    }

    /* Fixed frame for Visual Media */
    .card img,
    .card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #000;
      display: block;
    }

    /* Frame for Audio Files */
    .audio-container {
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #eef2f5;
      padding: 15px;
    }

    .audio-container audio {
      width: 100%;
    }

    /* Generic File Download Box */
    .file-container {
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #eef2f5;
      text-align: center;
      padding: 20px;
    }

    .file-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .file-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .file-btn:hover {
      background-color: #1557b0;
    }

    .card .info {
      padding: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: #fff;
      border-top: 1px solid #eee;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      margin-top: 50px;
    }

    #error {
      text-align: center;
      color: #d93025;
      font-size: 1rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Media & File Gallery</h1>
    <p>Loaded dynamically from Google Drive</p>
  </header>

  <div id="loading">Loading drive content...</div>
  <div id="error"></div>
  <div class="gallery" id="gallery"></div>

  <script>
    const FOLDER_ID = '1IlBDjudHYmo6y-JmYj7-IY9hhADEDxUC';
    const API_KEY = 'AIzaSyDM0_CoUN-DVcE4XWzDn2auPtPt1CQP2L0';

    async function loadGallery() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const galleryEl = document.getElementById('gallery');

      if (API_KEY === 'YOUR_GOOGLE_DRIVE_API_KEY') {
        loadingEl.style.display = 'none';
        errorEl.textContent = 'Please insert your Google Drive API key into the script.';
        return;
      }

      // Query: Retrieves ANY file inside the target folder that is not in trash
      const query = `'${FOLDER_ID}' in parents and trashed = false`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,webContentLink,webViewLink)&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        loadingEl.style.display = 'none';

        if (!data.files || data.files.length === 0) {
          errorEl.textContent = 'No files found in this folder.';
          return;
        }

        data.files.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          const mime = file.mimeType;
          const directMediaUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
          const streamVideoUrl = `https://drive.google.com/uc?export=download&id=${file.id}`;
          const viewLink = file.webViewLink || directMediaUrl;

          let contentHTML = '';

          // 1. IMAGE HANDLING
          if (mime.startsWith('image/')) {
            contentHTML = `
              <a href="${directMediaUrl}" target="_blank" rel="noopener noreferrer">
                <img src="${directMediaUrl}" alt="${file.name}" loading="lazy" />
              </a>
            `;
          } 
          // 2. VIDEO HANDLING
          else if (mime.startsWith('video/')) {
            contentHTML = `
              <video controls preload="metadata">
                <source src="${streamVideoUrl}" type="${mime}">
                <source src="${directMediaUrl}" type="${mime}">
                Your browser does not support playing this video.
              </video>
            `;
          } 
          // 3. AUDIO HANDLING
          else if (mime.startsWith('audio/')) {
            contentHTML = `
              <div class="audio-container">
                <div class="file-icon">🎵</div>
                <audio controls preload="metadata">
                  <source src="${streamVideoUrl}" type="${mime}">
                  Your browser does not support audio playback.
                </audio>
              </div>
            `;
          } 
          // 4. OTHER FILES (PDFs, Docs, ZIPs, Executables, etc.)
          else {
            let icon = '📁';
            if (mime.includes('pdf')) icon = '📄';
            else if (mime.includes('zip') || mime.includes('compressed')) icon = '📦';
            else if (mime.includes('spreadsheet') || mime.includes('excel')) icon = '📊';

            contentHTML = `
              <div class="file-container">
                <div class="file-icon">${icon}</div>
                <a href="${viewLink}" target="_blank" class="file-btn" rel="noopener noreferrer">Open / Download</a>
              </div>
            `;
          }

          card.innerHTML = `
            ${contentHTML}
            <div class="info" title="${file.name}">${file.name}</div>
          `;

          galleryEl.appendChild(card);
        });
      } catch (err) {
        loadingEl.style.display = 'none';
        errorEl.textContent = `Error loading content: ${err.message}`;
      }
    }

    loadGallery();
  </script>

</body>
</html>
